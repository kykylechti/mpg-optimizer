version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mpg-optimizer-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - mpg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mpg-optimizer-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mpg-network

networks:
  mpg-network:
    driver: bridge